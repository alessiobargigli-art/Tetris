<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d1f">
  <meta name="description" content="Tetris nel browser.">
  <title>Tetris</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d1f'/%3E%3Crect x='6' y='6' width='9' height='9' rx='2' fill='%23b678ff'/%3E%3Crect x='17' y='6' width='9' height='9' rx='2' fill='%23b678ff'/%3E%3Crect x='11' y='17' width='9' height='9' rx='2' fill='%23b678ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <aside class="side side-left">
      <section class="panel">
        <h2>Hold</h2>
        <canvas id="hold" class="preview" aria-label="Pezzo in hold"></canvas>
      </section>
      <section class="panel">
        <dl class="stats">
          <div><dt>Punti</dt><dd id="score">0</dd></div>
          <div><dt>Livello</dt><dd id="level">1</dd></div>
          <div><dt>Linee</dt><dd id="lines">0</dd></div>
          <div><dt>Record</dt><dd id="best">0</dd></div>
        </dl>
      </section>
    </aside>

    <div class="board-wrap">
      <canvas id="board" aria-label="Campo di gioco"></canvas>
      <div id="overlay" class="overlay" aria-live="polite">
        <p id="overlay-title" class="overlay-title">Tetris</p>
        <p id="overlay-text" class="overlay-text"></p>
        <button id="overlay-btn" class="primary" type="button">Gioca</button>
      </div>
    </div>

    <aside class="side side-right">
      <section class="panel">
        <h2>Prossimi</h2>
        <canvas id="next" class="preview preview-next" aria-label="Prossimi pezzi"></canvas>
      </section>
      <section class="panel help">
        <h2>Comandi</h2>
        <dl>
          <div><dt>← →</dt><dd>muovi</dd></div>
          <div><dt>↑ / X</dt><dd>ruota</dd></div>
          <div><dt>Z</dt><dd>ruota indietro</dd></div>
          <div><dt>↓</dt><dd>scendi piano</dd></div>
          <div><dt>Spazio</dt><dd>drop</dd></div>
          <div><dt>C / Shift</dt><dd>hold</dd></div>
          <div><dt>P / Esc</dt><dd>pausa</dd></div>
        </dl>
      </section>
    </aside>
  </main>

  <nav class="touch" aria-label="Comandi touch">
    <button type="button" data-action="left" aria-label="Sinistra">◀</button>
    <button type="button" data-action="right" aria-label="Destra">▶</button>
    <button type="button" data-action="rotccw" aria-label="Ruota indietro">↺</button>
    <button type="button" data-action="rotcw" aria-label="Ruota">↻</button>
    <button type="button" data-action="soft" aria-label="Scendi piano">▼</button>
    <button type="button" data-action="hard" aria-label="Drop">Drop</button>
    <button type="button" data-action="hold" aria-label="Hold">Hold</button>
  </nav>

  <script type="module" src="src/main.js"></script>
</body>
</html>
